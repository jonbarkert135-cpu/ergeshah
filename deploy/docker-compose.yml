# Single-VPS deployment: application + reverse proxy with automatic TLS.
# PostgreSQL is optional and commented out — SQLite is the default and needs no service.
#
#   cp ../.env.example ../.env && edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - app-data:/app/data
    networks: [edge, internal]
    # The application never needs to reach the internet. Denying it egress turns a whole
    # class of SSRF and exfiltration bugs into a connection error.
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

  # Uncomment for PostgreSQL, and set DB_DIALECT=postgres + DATABASE_URL in .env.
  # db:
  #   image: postgres:17-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ergeshah
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: ergeshah
  #   volumes: [db-data:/var/lib/postgresql/data]
  #   networks: [internal]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ergeshah"]
  #     interval: 10s

  # Uncomment to publish the same application as a Tor onion service. See
  # docs/DEPLOYMENT.md — the onion service reaches `app` directly, so the clearnet proxy
  # and the onion entrypoint never share a log or a TLS terminator.
  # tor:
  #   image: ghcr.io/hectorm/tor-proxy:latest
  #   restart: unless-stopped
  #   volumes: [tor-data:/var/lib/tor]
  #   networks: [internal]

volumes:
  app-data:
  caddy-data:
  caddy-config:
  # db-data:
  # tor-data:

networks:
  edge:
  internal:
    internal: true
