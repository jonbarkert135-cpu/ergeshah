# Single-VPS deployment: application + reverse proxy with automatic TLS.
# PostgreSQL is optional and commented out — SQLite is the default and needs no service.
#
#   cp ../.env.example ../.env && edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Every property this file sets on purpose is asserted by `test/deployment.test.ts`, so a
# container cannot quietly lose its capability drop or its memory limit in a later edit.
#
# Images are pinned by digest, not by tag. `node:22-bookworm-slim` is a name that points at
# different bytes every month; a digest is the bytes. Refreshing them is a deliberate act:
# `docker buildx imagetools inspect node:22-bookworm-slim` prints the current one, and the
# tag is left beside the digest so it is obvious what is being pinned.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - app-data:/app/data
    # The APPLICATION tier, and nothing else (docs/NETWORK.md). It is *only* on the
    # internal network: no published port, and no route to the internet, so the whole
    # class of "the bug made an outbound request" ends at a connection error. The proxy
    # reaches it because the proxy is the one service that sits on both networks.
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # A limit is a blast radius, not a performance setting: it decides how much of the host
    # one runaway request loop, one memory leak or one fork bomb can take. Raise them for a
    # busy instance; do not remove them.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Logs are size-bounded here, and there is nothing in them about a request (see
    # docs/LOGGING.md). On a journald host use MaxRetentionSec=1week instead.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  proxy:
    # caddy:2-alpine
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # The REVERSE PROXY tier: the only service on both networks, and the only one with a
    # published port. It needs `edge` for ACME and for the public listener, and `internal`
    # to reach the application.
    networks: [edge, internal]
    security_opt: ["no-new-privileges:true"]
    # Ports 80 and 443 are privileged, so exactly one capability comes back. Everything
    # else — raw sockets, module loading, changing file ownership — goes.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    # Caddy's admin API is off, so there is nothing to ask on :2019. The Caddyfile answers
    # /healthz on :8081 instead — a port that is never published, so the check exists for
    # the host and not for the internet.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Uncomment for PostgreSQL, and set DB_DIALECT=postgres + DATABASE_URL in .env.
  #
  # Note what is *not* here: a `ports:` mapping. A database is on the DATABASE tier, which
  # means the application can reach it and the internet cannot. If you need psql, tunnel it
  # over SSH (docs/HARDENING.md) — publishing 5432 "just while I debug" is how databases
  # end up in breach notifications.
  # db:
  #   # postgres:17-alpine
  #   image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: symvolon
  #     POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  #     POSTGRES_DB: symvolon
  #   secrets: [postgres_password]
  #   volumes: [db-data:/var/lib/postgresql/data]
  #   networks: [internal]
  #   security_opt: ["no-new-privileges:true"]
  #   mem_limit: 1g
  #   pids_limit: 256
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U symvolon"]
  #     interval: 10s

  # Uncomment to publish the same application as a Tor onion service. It talks to `app`
  # directly on the internal network, so the clearnet proxy and the onion entrypoint share
  # no TLS terminator and no log. Read the onion section of docs/DEPLOYMENT.md first —
  # the address lands in tor-data, and the cookie/CSP behaviour adapts to it automatically.
  # tor:
  #   build:
  #     context: ./tor
  #   restart: unless-stopped
  #   depends_on: [app]
  #   volumes:
  #     - ./tor/torrc:/etc/tor/torrc:ro
  #     - tor-data:/var/lib/tor
  #   networks: [internal, edge]   # `edge` only so Tor can reach the Tor network
  #   security_opt: ["no-new-privileges:true"]
  #   cap_drop: [ALL]
  #   mem_limit: 256m
  #   pids_limit: 128

  # Uncomment for the Monero tier (ADR-0070). Two containers: a daemon with the only egress
  # in this deployment besides ACME, and a *view-only* wallet the application polls. Set
  # MONERO_WALLET_RPC_URL=http://wallet:18082 in .env once they are up.
  #
  # The wallet is opened from a file the operator created *elsewhere* with the private view
  # key of the deposit wallet (`monero-wallet-cli --generate-from-view-key`) — the spend key
  # never goes near this machine, and the payout wallet is not in this file at all: it runs on
  # another host and pulls the queue (scripts/payout-worker.mjs, docs/PAYMENTS.md §Keys).
  #
  # Sized for a pruned node: ~4 GB RAM and room for ~90 GB with growth.
  # node:
  #   # sethsimmons/simple-monerod:v0.18.3.4 — a third-party image; building monerod from
  #   # source and pinning your own is the stricter option (docs/DEPLOYMENT.md).
  #   image: sethsimmons/simple-monerod@sha256:a17e6e72c8eafb05d04a4dc5f2dda8a9f0c237c7013b0936fcee180c4a284104
  #   restart: unless-stopped
  #   command: ["--prune-blockchain", "--restricted-rpc", "--rpc-bind-ip=0.0.0.0",
  #             "--rpc-bind-port=18081", "--confirm-external-bind", "--non-interactive"]
  #   volumes: [monero-node:/home/monero/.bitmonero]
  #   # `edge` is the point: the daemon is the tier that talks to the Monero network, so that
  #   # `app` still has no route to the internet. Route it over Tor if the operator can.
  #   networks: [internal, edge]
  #   security_opt: ["no-new-privileges:true"]
  #   cap_drop: [ALL]
  #   mem_limit: 4g
  #   pids_limit: 256
  # wallet:
  #   # sethsimmons/simple-monero-wallet-rpc:v0.18.3.4
  #   image: sethsimmons/simple-monero-wallet-rpc@sha256:13fd4f6914b15ad34239a9dbc5a5c599b9adad38af803353854052318830ec67
  #   restart: unless-stopped
  #   depends_on: [node]
  #   command: ["--wallet-file=/wallet/deposits", "--password-file=/run/secrets/wallet_password",
  #             "--daemon-address=node:18081", "--rpc-bind-ip=0.0.0.0", "--rpc-bind-port=18082",
  #             "--confirm-external-bind", "--disable-rpc-login", "--trusted-daemon",
  #             "--non-interactive"]
  #   volumes: [monero-wallet:/wallet]
  #   secrets: [wallet_password]
  #   # No `ports:` and no `edge`: the only thing that can reach this RPC is `app`, which is
  #   # why `--disable-rpc-login` is acceptable here and nowhere else.
  #   networks: [internal]
  #   security_opt: ["no-new-privileges:true"]
  #   cap_drop: [ALL]
  #   mem_limit: 512m
  #   pids_limit: 128

volumes:
  app-data:
  caddy-data:
  caddy-config:
  # db-data:
  # tor-data:
  # monero-node:
  # monero-wallet:

# How to hand a secret to a container without putting it in the environment: mount it as a
# file and point the `_FILE` variable at it. `config.ts` reads either form. See the secrets
# section of docs/DEPLOYMENT.md.
# secrets:
#   postgres_password:
#     file: ./secrets/postgres_password

networks:
  # PUBLIC-facing side. Only the proxy is here.
  edge:
  # APPLICATION and DATABASE tiers. `internal: true` means Docker creates no gateway for
  # it: containers here can talk to each other and to nothing else.
  internal:
    internal: true
