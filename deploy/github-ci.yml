name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Tests (crypto vectors, protocol properties, API, authorization)
        run: npm test
      - name: Build client
        run: npm run build:client
      - name: Audit production dependencies
        run: npm run audit:deps
