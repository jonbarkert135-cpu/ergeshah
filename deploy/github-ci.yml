name: ci

# Этот файл живёт по двум путям:
#   deploy/github-ci.yml      — версия в репозитории, её правят агенты
#   .github/workflows/ci.yml  — работающая копия, её вставляет человек
# GitHub App агента не имеет права workflows, поэтому копию обновляет владелец репо.
# Чтобы копию приходилось трогать как можно реже, шаги ниже вызывают npm-скрипты,
# а не команды: новые проверки добавляются в package.json, не сюда.

on:
  push:
    branches: [main]
  pull_request:

# The workflow needs to read the code and nothing else. No token is written to the
# checkout (persist-credentials: false), so a compromised build step has no credential
# to push with.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to different code,
      # and a third-party action runs with our token in our runner (point 34).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          # audit:history walks every commit, so the full history is needed here.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # .npmrc sets ignore-scripts=true, so nothing in the dependency tree executes code
      # during installation. `npm ci` fails if package-lock.json and package.json disagree.
      - run: npm ci

      - name: Lint and type check
        run: npm run check

      - name: Tests (crypto vectors, protocol, API, authorization, limits, defaults, docs)
        run: npm test

      - name: Build client
        run: npm run build:client

      # One step, eleven audits: dependency CVEs, dependency policy and licences, client
      # bundle and build reproducibility, secrets in the working tree, secrets anywhere in
      # git history, migration order and checksums, supply-chain policy, server-side egress
      # (every outbound call named, no host in the source, no telemetry package), the
      # dependency inventory freeze, and the security baseline. All of them are npm scripts
      # inside `npm run audit`, so adding one needs no change to this file.
      - name: Security audits
        run: npm run audit

  # The same suite, against a real PostgreSQL (OPS-2). Both drivers ship, so both are
  # tested: the first time this job existed it found that the PostgreSQL path could not
  # finish its own migrations, and that concurrent callers could be handed the same
  # one-time prekey (docs/SELF_CRITIQUE.md, findings 8 and 9). A driver exercised only by
  # hand is a driver that works until somebody deploys it.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: symvolon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test/backup_postgres.test.ts runs pg_dump against the container above; the runner's
      # preinstalled client is older than the server and pg_dump refuses that, so the test
      # would skip itself (loudly) without this. Cannot be an npm script: it needs apt.
      - name: PostgreSQL client tools, matching the server
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: Tests (PostgreSQL driver)
        run: npm run test:postgres
        env:
          # A throwaway database in a container that lives for the length of this job.
          TEST_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/symvolon_test
